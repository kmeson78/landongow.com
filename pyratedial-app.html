<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#161412" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pyrate Dial" />
  <meta name="description" content="Pyrate Dial — personal frequency receiver, mobile app." />
  <link rel="manifest" href="pyratedial-app-manifest.webmanifest" />
  <link rel="apple-touch-icon" href="pyratedial-icon-192.png" />
  <link rel="stylesheet" href="pyratedial-app.css?v=2" />
  <title>Pyrate Dial</title>
</head>
<body>
  <div class="app-shell">
    <header class="masthead" aria-label="Pyrate Dial">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true"><img src="pyratedial-ship.png" alt="" /></div>
        <div>
          <h1>PYRATE DIAL</h1>
          <p>PERSONAL FREQUENCY RECEIVER</p>
        </div>
      </div>
    </header>

    <main class="hero">
      <section class="display" aria-live="polite" aria-atomic="true">
        <div class="display-glass"></div>
        <div class="frequency-row">
          <div class="frequency" id="heroFrequency">—</div>
          <div class="unit">FM</div>
        </div>
        <div class="station-name" id="heroName">SELECT A STATION</div>
        <div class="signal-status" id="heroStatus">STANDBY</div>
      </section>

      <div class="monitor-bay" id="monitorBay">
        <div class="monitor-bezel">
          <div class="monitor-screen" id="playerSlot">
            <div class="monitor-standby"><span>STANDBY</span></div>
          </div>
        </div>
      </div>

      <div class="dial-scale" aria-hidden="true">
        <div class="scale-labels">
          <span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span>
        </div>
        <div class="scale-line"><span class="scale-marker" id="signalMarker"></span></div>
      </div>
    </main>

    <nav class="preset-strip" id="presetStrip" aria-label="Stations"></nav>
  </div>

  <script src="pyratedial-app.js?v=2"></script>
</body>
</html>
